name: tevel_push
description: Direct APNs registration, foreground display and taps for the Tevel invoice app (no Firebase).
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: TevelPushPlugin
